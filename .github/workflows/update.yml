name: stocks.json guncelle (SEC EDGAR)

# Veri kaynagi SEC EDGAR (ucretsiz, anahtarsiz). Fair-access siniri saniyede
# 10 istek; script ~1 istek/sn gider.
#
# İki katmanli cache:
#   - cache/       : ham SEC companyfacts yanitlari (~2GB). .gitignore'da,
#                    sadece yerel hiz icin. Actions'ta her calismada bostur.
#   - cache-slim/  : cikarilmis ozet (~0.7MB, repoya commit'lenir). 20 gunden
#                    yeni kayitlar icin EDGAR'a HIC gidilmez.
#
# Yani ilk hafta ~500 sirket icin tam EDGAR taramasi (~20-25 dk) yapilir ve
# cache-slim/ commit'lenir; sonraki haftalar cogunlukla slim'den okur, sadece
# fiyat (Yahoo) ve bayat kayitlar yenilenir (~5-10 dk).
on:
  schedule:
    - cron: '0 6 * * 1' # her pazartesi 06:00 UTC
  workflow_dispatch: {} # elle tetikleme

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Veriyi cek ve stocks.json uret
        run: node scripts/build.mjs

      - name: Degisiklik varsa commit'le
        run: |
          git add stocks.json cache-slim/
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanacak."
            exit 0
          fi
          git config user.name  "mizan-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: stocks.json haftalik guncelleme (SEC EDGAR + AAOIFI)"
          git push
